; DrinkBotController firmware (see SPEC_v3.md)

[platformio]
default_envs = xiao

[env:xiao]
; pioarduino platform: Arduino-ESP32 core 3.1.3 on ESP-IDF 5.3.2
platform = espressif32@53.3.13
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_ldf_mode = chain
; The sync core WebServer is matched by header name but not used (ESPAsyncWebServer replaces it)
lib_ignore = WebServer
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++2a
    ; Native USB is used in host mode for the pump link, so keep it free
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    ; Core libraries listed explicitly: the dependency finder misses Network on this core
    Networking
    WiFi
    FS
    LittleFS
    ESPmDNS
    DNSServer
    Update
    bblanchon/ArduinoJson@7.2.1
    mathieucarbou/ESPAsyncWebServer@3.6.0
    adafruit/Adafruit NeoPixel@1.12.3

; Host-side unit tests of the hardware-independent code in src/core and src/sim
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<core/> +<sim/>
build_flags =
    -std=c++17
    -Isrc
    -Wall
lib_deps =
    bblanchon/ArduinoJson@7.2.1

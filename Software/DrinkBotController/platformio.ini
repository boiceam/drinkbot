; DrinkBotController firmware (see SPEC_v3.md)

[platformio]
default_envs = yd_esp32s3

; Settings shared by the hardware targets
[esp32s3_common]
; pioarduino platform: Arduino-ESP32 core 3.1.3 on ESP-IDF 5.3.2
platform = espressif32@53.3.13
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
; Gzips web/ into src/generated/web_assets.h before each build (§4.6)
extra_scripts = pre:scripts/embed_web.py
lib_ldf_mode = chain
; The sync core WebServer is matched by header name but not used (ESPAsyncWebServer replaces it)
lib_ignore = WebServer
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++2a
    ; Native USB is used in host mode for the pump link, so keep it free
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    ; Core libraries listed explicitly: the dependency finder misses Network on this core
    Networking
    WiFi
    FS
    LittleFS
    ESPmDNS
    Update
    bblanchon/ArduinoJson@7.2.1
    ; AsyncTCP 3.3.2 clears callbacks on a pcb lwIP has already freed, which crashed
    ; in AsyncServer::_accept when clients reset connections (SPEC_v3 §4.2)
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1
    adafruit/Adafruit NeoPixel@1.12.3

; VCC-GND Studio YD-ESP32-S3 (ESP32-S3-WROOM-1 N16R8: 16 MB QIO flash, 8 MB octal PSRAM).
; Flash and the debug log use the "COM" USB-C port (CH343 USB-UART on UART0);
; the "USB" port (native GPIO 19/20) is the USB host link to the bridge pump.
[env:yd_esp32s3]
extends = esp32s3_common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${esp32s3_common.build_flags}
    -DBOARD_HAS_PSRAM
    -DDRINKBOT_BOARD_YD_ESP32S3

; Previous target, kept for reference: Seeed XIAO ESP32-S3 (same GPIO numbers)
[env:xiao]
extends = esp32s3_common
board = seeed_xiao_esp32s3
board_build.partitions = default_8MB.csv
build_flags =
    ${esp32s3_common.build_flags}
    -DDRINKBOT_BOARD_XIAO_ESP32S3

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<core/> +<sim/>
build_flags =
    -std=c++17
    -Isrc
    -Wall
lib_deps =
    bblanchon/ArduinoJson@7.2.1
